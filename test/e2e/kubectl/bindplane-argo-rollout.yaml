apiVersion: k8s.bindplane.com/v1alpha1
kind: Bindplane
metadata:
  name: bindplane-argo-rollout
  annotations:
    # No postgres in this test: the migrate Job fails, so bypass the migration gate
    # and let the operator reconcile downstream workloads regardless.
    k8s.bindplane.com/skip-migrate-check: "true"
spec:
  config:
    license: "test-license"
    store:
      postgres:
        host: postgres.postgres.svc
  bindplane:
    replicas: 1
    argoRollout:
      enabled: true
