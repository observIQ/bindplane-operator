name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest-8-cores
    steps:
      - name: Validate tag format
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "Error: tag '${GITHUB_REF_NAME}' must not have a 'v' prefix (e.g. use '1.0.0' not 'v1.0.0')"
            exit 1
          fi

      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Required by the sboms stanza in .goreleaser.yaml (binary SBOMs).
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release
          version: v2.14.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signing lives in its own workflow so that it can also be dispatched on its
  # own to sign a release published earlier. See .github/workflows/sign.yml.
  sign:
    name: Sign
    needs: release
    permissions:
      contents: read
      packages: write  # push cosign signatures and attestations to GHCR
      id-token: write  # required for cosign keyless signing via Sigstore
    uses: ./.github/workflows/sign.yml
    with:
      tag: ${{ github.ref_name }}
